name: Forge Test & Coverage

on:
  push:
    branches:
      - 'main'
    paths:
      - 'solidity/**'
      - '.github/workflows/forge-test.yml'
  pull_request:
    paths:
      - 'solidity/**'
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check
        id: fmt
        working-directory: solidity

      - name: Run Forge build
        run: forge build --sizes
        id: build
        working-directory: solidity

      - name: Check V1.1 bytecode is unchanged
        run: ./script/check-v1-1-bytecode.sh
        id: bytecode-v1-1
        working-directory: solidity

      - name: Run Forge tests
        run: forge test -vvv
        id: test
        working-directory: solidity

      - name: Run Forge coverage
        # --ir-minimum: CATValidatorV1_1 does not compile under the legacy
        # (non-IR) pipeline coverage otherwise uses, because of stack depth.
        # The two excluded tests assert the optimized build's creation hash and gas.
        run: >
          forge coverage --ir-minimum --no-match-coverage "(script|test)"
          --no-match-test "(test_reference_is_pinned|test_gas_entry_delta_base_to_v1_1)" --report lcov
        id: coverage
        working-directory: solidity

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: solidity/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
